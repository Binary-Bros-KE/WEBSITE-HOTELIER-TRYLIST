name: Deploy website to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            exec 9>"$HOME/.hotelier-deploy.lock"
            flock -w 1500 9 || { echo "Another deploy is still running - giving up"; exit 1; }
            export HOTELIER_DEPLOY_LOCKED=1
            # Take only the deploy script from the new commit; it does the rest.
            if [ -d ~/WEBSITE-HOTELIER/.git ]; then
              cd ~/WEBSITE-HOTELIER
              git update-ref -d refs/remotes/origin/main || true
              git fetch --prune --force origin +refs/heads/main:refs/remotes/origin/main
              git checkout origin/main -- scripts/deploy.sh
              bash scripts/deploy.sh
            else
              curl -fsSL https://raw.githubusercontent.com/Binary-Bros-KE/WEBSITE-HOTELIER-TRYLIST/main/scripts/deploy.sh | bash
            fi
